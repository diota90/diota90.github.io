<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Despoina Ioannidou</title>
<meta name="description" content="Despoina Ioannidou — building Coforix.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%}
  body{background:#f3efe4;color:#1d1b17;font-family:'Courier Prime','Courier New',monospace;-webkit-font-smoothing:antialiased;display:flex;align-items:center;padding:0 clamp(24px,8vw,128px);box-sizing:border-box}
  main{display:flex;flex-direction:column;gap:clamp(24px,3vw,36px);max-width:100%}
  h1{margin:0;font-weight:700;font-size:clamp(36px,7vw,96px);line-height:1;letter-spacing:-.02em;min-height:1em;white-space:nowrap}
  .caret{display:inline-block;width:.55em;height:.9em;background:#c2410c;vertical-align:-.08em;margin-left:.05em;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  nav{display:flex;flex-direction:column;gap:12px;font-size:clamp(17px,1.8vw,22px);opacity:0;transform:translateY(4px);transition:opacity .6s,transform .6s}
  nav.on{opacity:1;transform:none}
  a{color:#1d1b17;text-decoration:none;width:fit-content;display:inline-flex;gap:12px}
  a::before{content:'>';color:#c2410c}
  a span{border-bottom:1px solid currentColor}
  a:hover{color:#c2410c}
  @media (prefers-reduced-motion:reduce){.caret{animation:none}nav{transition:none}}
</style>
</head>
<body>
<main>
  <h1 aria-label="Despoina Ioannidou"><span id="t"></span><span class="caret" aria-hidden="true"></span></h1>
  <nav id="n">
    <a href="https://coforix.ai"><span>building coforix</span></a>
    <a href="https://github.com/EUreqAI/eureqai"><span>navigating the ai act</span></a>
  </nav>
</main>
<script>
  const s = 'Despoina Ioannidou', t = document.getElementById('t'), n = document.getElementById('n');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { t.textContent = s; n.classList.add('on'); }
  else {
    let i = 0;
    const type = () => {
      t.textContent = s.slice(0, ++i);
      if (i < s.length) setTimeout(type, 70 + Math.random() * 90);
      else setTimeout(() => n.classList.add('on'), 300);
    };
    setTimeout(type, 500);
  }
</script>
</body>
</html>
